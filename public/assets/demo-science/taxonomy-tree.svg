  <path d="M480 398c-90 10-150 45-188 106" stroke="#58CC02" stroke-width="12" stroke-linecap="round"/>
  <path d="M480 482c86 10 146 46 186 106" stroke="#FFC800" stroke-width="12" stroke-linecap="round"/>
